<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Fishful Thinking</title>
<style>
/* Layout: one column, big thumb targets, tab bar at the bottom. Sun-readable, high contrast. */
:root{--bg:#e9eff1;--surf:#ffffff;--ink:#0d222c;--mut:#4d6672;--line:#c7d4da;--acc:#ff5a1f;--acc-ink:#ffffff;--ok:#0b7a6b;--tide:#1c6fa8;--warn:#a85d00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a22;--surf:#122833;--ink:#eaf3f6;--mut:#9fb6c0;--line:#244150;--acc:#ff6a2b;--acc-ink:#0b1a22;--ok:#3ccfb8;--tide:#58b4f0;--warn:#f0a53a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a22;--surf:#122833;--ink:#eaf3f6;--mut:#9fb6c0;--line:#244150;--acc:#ff6a2b;--acc-ink:#0b1a22;--ok:#3ccfb8;--tide:#58b4f0;--warn:#f0a53a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 0 120px}
h1{font-size:28px;line-height:1.1;margin:4px 0 4px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:24px 0 8px;font-weight:700}
p{margin:6px 0}
.mut{color:var(--mut)}
.sm{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surf);padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.row:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.wide{width:100%}
.btn.sm{min-height:48px;font-size:15px}
.big{width:100%;min-height:min(34vh,260px);min-height:max(190px,min(34vh,260px));border-radius:22px;border:0;background:var(--acc);color:var(--acc-ink);font-size:38px;font-weight:900;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.big small{font-size:15px;font-weight:700;opacity:.85}
.big:active{transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;text-align:left;width:100%}
.row b{font-size:17px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ok);vertical-align:-2px}
.dot.f{background:var(--ok)}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
.pill.t{color:var(--warn);border-color:var(--warn)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:5}
.tab{min-height:60px;border:0;background:transparent;font-weight:700;color:var(--mut);font-size:14px}
.tab[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
#bar{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;z-index:9;display:none;max-width:560px;margin:0 auto}
#bar.on{display:block}
#bar .chips{margin-top:8px}
#bar .chip{background:transparent;color:var(--bg);border-color:var(--bg)}
#bar .chip[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surf);padding:8px 12px}
input[type=range]{width:100%;min-height:48px;accent-color:var(--acc)}
svg text{fill:var(--mut);font-size:11px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:4px}
.note{border-left:4px solid var(--warn);padding:6px 10px;font-size:14px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="bar" role="status"></div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<script>
'use strict';
const VERSION='19';
/* ---------- storage ---------- */
const KEY='fishful.v1', CKEY='fishful.cache.v1';
const DEF_SPECIES=['Bass','Pollack','Mackerel','Wrasse','Other'];
function jget(k,d){try{const j=JSON.parse(localStorage.getItem(k));return j==null?d:j}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=jget(KEY,null)||{marks:[],trips:[],last:null};
S.profile=S.profile||{mode:null};S.profile.done=true;S.plan=S.plan||null;S.here=S.here||null;S.method=S.method||{m:'Lures',bait:''};
let CACHE=jget(CKEY,{});
const save=()=>jset(KEY,S), saveCache=()=>{try{const k=Object.keys(CACHE);if(k.length>400)k.slice(0,100).forEach(x=>delete CACHE[x])}catch(e){}jset(CKEY,CACHE)};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mark=id=>S.marks.find(m=>m.id===id);
const openTrip=()=>S.trips.find(t=>!t.end&&!t.past);
function getPos(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>{const o={lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4)};S.here=o;save();r(o)},()=>r(null),{timeout:10000,maximumAge:30000,enableHighAccuracy:true})})}
const dist=(a,b)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const refPoint=()=>S.here||(S.last&&mark(S.last))||S.marks[0]||null;
const nearestMark=(p,max)=>{let b=null,bd=max;S.marks.forEach(m=>{const d=dist(p,m);if(d<=bd){bd=d;b=m}});return b};

/* ---------- time helpers (UK time) ---------- */
const ymd=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(d);
const hourOf=d=>Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',hour12:false}).format(d))%24;
const hhmm=d=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
const dlong=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const OCT=['N','NE','E','SE','S','SW','W','NW'];
const oct=d=>OCT[Math.round(((d%360)+360)%360/45)%8];

/* ---------- conditions (Open-Meteo, approximate model tide) ---------- */
async function jfetch(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),9000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function getDay(m,date){
  const k='v2,'+m.lat.toFixed(2)+','+m.lng.toFixed(2)+','+date;
  const c=CACHE[k], today=ymd(new Date());
  if(c&&(date<today||Date.now()-c.at<3*3600e3))return c.d;
  try{
    const ll='latitude='+m.lat+'&longitude='+m.lng+'&start_date='+date+'&end_date='+date+'&timezone=Europe%2FLondon';
    const old=date<addDays(today,-85);
    const [mar,wx]=await Promise.all([
      jfetch('https://marine-api.open-meteo.com/v1/marine?'+ll+'&hourly=sea_level_height_msl'),
      jfetch((old?'https://archive-api.open-meteo.com/v1/archive?':'https://api.open-meteo.com/v1/forecast?')+ll+'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,precipitation,weather_code,cloud_cover,pressure_msl&wind_speed_unit=kn')]);
    const d={lvl:mar.hourly.sea_level_height_msl,wsp:wx.hourly.wind_speed_10m,wdr:wx.hourly.wind_direction_10m,gst:wx.hourly.wind_gusts_10m,tmp:wx.hourly.temperature_2m,rain:wx.hourly.precipitation,wc:wx.hourly.weather_code,cld:wx.hourly.cloud_cover,prs:wx.hourly.pressure_msl};
    CACHE[k]={at:Date.now(),d};saveCache();return d;
  }catch(e){return c?c.d:null}
}
function tideState(lvl,h){
  if(!lvl)return null;const v=lvl.filter(x=>x!=null);if(v.length<20)return null;
  const mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn;if(rg<0.4)return null;
  const a=lvl[Math.max(0,h-1)],b=lvl[Math.min(23,h+1)],l=lvl[h];if(a==null||b==null||l==null)return null;
  const s=b-a,thr=rg*0.14;
  if(s>thr)return 'rising';if(s<-thr)return 'falling';return l>(mx+mn)/2?'high':'low';
}
function featsAt(day,h){
  if(!day)return null;
  return{tide:tideState(day.lvl,h),wsp:day.wsp[h]==null?null:Math.round(day.wsp[h]),wdr:day.wdr[h]==null?null:Math.round(day.wdr[h]),h};
}
async function fillCond(t){
  const m=mark(t.markId);if(!m||t.cond)return;
  const d=new Date(t.start);const day=await getDay(m,ymd(d));
  const f=featsAt(day,hourOf(d));if(f&&(f.wsp!=null||f.tide)){t.cond=f;save()}
}
const condText=c=>!c?'conditions not yet filled':[c.tide?cap(c.tide)+' tide':null,c.wsp!=null?oct(c.wdr)+' '+c.wsp+' kn':null].filter(Boolean).join(', ')||'no data';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- view state ---------- */
let ob=0, pickCtx='marks', sumId=null, view='home', viewArg=null, planDay=ymd(new Date()), planStart=6, planMark=null, undoT=null, lastFish=null;
const TABS=[['home','Home'],['plan','Plan'],['marks','Marks'],['me','Me']];
function go(v,a){if(v==='plan'&&view!=='plan'&&view!=='mark'){planStep=1;planWhere=null}view=v;viewArg=a||null;window.scrollTo(0,0);render()}
function renderTabs(){
  const cur=view==='mark'||view==='addmark'?'marks':(view==='end'||view==='past'?'home':view);
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>'<button class="tab" data-go="'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+l+'</button>').join('');
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.arg||null);return}
  const a=e.target.closest('[data-act]');if(a&&actions[a.dataset.act])actions[a.dataset.act](a,e);
});

/* ---------- bar (saved / undo / species) ---------- */
function showBar(html,ms){const b=document.getElementById('bar');b.innerHTML=html;b.classList.add('on');clearTimeout(undoT);undoT=setTimeout(()=>b.classList.remove('on'),ms||6000)}
function hideBar(){document.getElementById('bar').classList.remove('on')}
const SIZES=['Under 30 cm','30 to 45 cm','45 to 60 cm','Over 60 cm'];
const METHODS=['Lures','Live bait','Dead bait','Feathers','Other'];
function fishBar(t,f){
  const used={};S.trips.forEach(x=>(x.fish||[]).forEach(y=>{if(y.sp)used[y.sp]=(used[y.sp]||0)+1}));
  const sp=[...new Set([...Object.keys(used).sort((a,b)=>used[b]-used[a]),...DEF_SPECIES])].slice(0,5);
  const ids=' data-t="'+t.id+'" data-f="'+f.id+'"';
  showBar('<div class="top"><b>Saved on phone</b><button class="chip" data-act="undoFish"'+ids+'>Undo</button></div><div class="chips">'+
    sp.map(s=>'<button class="chip" aria-pressed="'+(f.sp===s)+'" data-act="species"'+ids+' data-s="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div>'+
    '<div class="chips">'+SIZES.map(s=>'<button class="chip" aria-pressed="'+(f.size===s)+'" data-act="size"'+ids+' data-s="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div>',11000);
}

/* ---------- actions ---------- */
const actions={
  /* flow A: first run */
  setMode2(el){S.profile.mode=el.dataset.m;save();document.querySelectorAll('[data-act=setMode2]').forEach(b=>b.setAttribute('aria-pressed',b===el))},
  obNext(){ob=1;render()},
  setMode(el){S.profile={mode:el.dataset.m,done:false};save();ob=2;render()},
  async allowLoc(el){el.textContent='Finding you…';await getPos();S.profile.done=true;save();go('home')},
  skipLoc(){S.profile.done=true;save();go('home')},
  /* flow C: fishing now */
  async startNow(el){
    el.disabled=true;const pos=(await getPos())||S.here;let m=null;
    if(pos){m=nearestMark(pos,300);if(!m){m=newMark('Unnamed spot',pos.lat,pos.lng);m.unnamed=true;save()}beginTrip(m,pos)}
    else if(S.last&&mark(S.last))beginTrip(mark(S.last),null);
    else{pickCtx='start';go('startpick')}
  },
  async startPlanned(el){const p=S.plan,m=p&&mark(p.markId);if(!m)return;el.disabled=true;const pos=await getPos();S.plan=null;save();beginTrip(m,pos)},
  startAt(el){const m=mark(el.dataset.m);if(m)beginTrip(m,null)},
  setMethod(el){S.method.m=el.dataset.s;document.querySelectorAll('[data-act=setMethod]').forEach(b=>b.setAttribute('aria-pressed',b===el))},
  goFish(){const t=openTrip();if(!t)return;const b=document.getElementById('bait');S.method.bait=b?b.value.trim():'';t.method=S.method.m;t.bait=S.method.bait;t.setup=true;save();go('home')},
  fishOn(){const t=openTrip();if(!t)return;const f={id:uid(),t:Date.now(),sp:null,size:null};t.fish.push(f);save();if(navigator.vibrate)navigator.vibrate(40);render();fishBar(t,f)},
  undoFish(el){const t=S.trips.find(x=>x.id===el.dataset.t);if(!t)return;t.fish=t.fish.filter(f=>f.id!==el.dataset.f);save();hideBar();render()},
  species(el){const t=S.trips.find(x=>x.id===el.dataset.t);const f=t&&t.fish.find(x=>x.id===el.dataset.f);if(!f)return;f.sp=f.sp===el.dataset.s?null:el.dataset.s;save();fishBar(t,f);render()},
  size(el){const t=S.trips.find(x=>x.id===el.dataset.t);const f=t&&t.fish.find(x=>x.id===el.dataset.f);if(!f)return;f.size=f.size===el.dataset.s?null:el.dataset.s;save();fishBar(t,f)},
  endAsk(){const t=openTrip();if(!t)return;if(t.fish.length){finish(t,'fish')}else go('end')},
  endBlank(){const t=openTrip();if(t)finish(t,'blank')},
  endOne(){const t=openTrip();if(!t)return;t.fish.push({id:uid(),t:Date.now(),sp:null,size:null});finish(t,'fish')},
  changeMethod(){go('method')},
  cancelTrip(){const t=openTrip();if(t&&!t.fish.length){S.trips=S.trips.filter(x=>x!==t);save()}go('home')},
  keepGoing(){go('home')},
  nameSpot(){const m=mark(viewArg),v=document.getElementById('nm').value.trim();if(m&&v){m.name=v;m.unnamed=false;save()}go('summary',sumId)},
  skipName(){go('summary',sumId)},
  delTrip(el){S.trips=S.trips.filter(t=>t.id!==el.dataset.t);save();go('mark',viewArg)},
  fillAll(el){fillMissing(el)},
};
function beginTrip(m,pos){
  const t={id:uid(),markId:m.id,start:Date.now(),end:null,result:null,fish:[],startLoc:pos||null,method:S.method.m,bait:S.method.bait,setup:true};
  S.trips.push(t);S.last=m.id;save();fillCond(t);go('home');
}
async function finish(t,res){
  t.end=Date.now();t.result=res;hideBar();
  const pos=await getPos();const m=mark(t.markId);
  if(pos){t.endLoc=pos;const s=t.startLoc;if(s)t.kind=dist(s,pos)>300?'drift':'spot'}
  save();sumId=t.id;
  if(m&&m.unnamed)go('name',m.id);else go('summary',t.id);
}

/* ---------- views ---------- */
function render(){
  const app=document.getElementById('app');
    renderTabs();
  const V={home:vHome,end:vEnd,past:vPast,plan:vPlan,marks:vMarks,mark:vMark,addmark:vAddMark,me:vMe,startpick:vStartPick,method:app=>{const t=openTrip();if(!t)return go('home');vMethod(app,t)},name:vName,summary:vSummary,about:vAbout}[view]||vHome;
  app.innerHTML='';V(app);
}
function condLine(t){return esc(condText(t.cond))}

/* ---------- flow A: first run ---------- */
const ABOUT='<p>Fishful Thinking was built by fishermen who wanted to improve their catch rates by analysing the data.</p><p>We made it simple and easy for everyone else to improve their fishing.</p>';
function onboard(app){
  if(ob===0){
    app.innerHTML='<h1>Fishful Thinking</h1><div class="card" style="margin-top:14px;font-size:18px">'+ABOUT+'</div>'+
      '<p class="mut" style="margin-top:14px">Free. No account. Your trips stay on this phone.</p>'+
      '<p style="margin-top:18px"><button class="big" style="min-height:90px;font-size:26px" data-act="obNext">Get started</button></p>';
  }else if(ob===1){
    app.innerHTML='<h1>Boat or shore?</h1><p class="mut">One tap. It is remembered.</p><div class="stack" style="margin-top:16px"><button class="big" style="min-height:130px;font-size:30px" data-act="setMode" data-m="boat">Boat</button><button class="big" style="min-height:130px;font-size:30px;background:var(--tide);color:var(--bg)" data-act="setMode" data-m="shore">Shore</button></div>';
  }else{
    app.innerHTML='<h1>Allow location, once</h1><p class="mut">So the app can show the tide and wind where you are, and notice when you are on a mark you have fished before. Your position stays on this phone.</p><div class="stack" style="margin-top:16px"><button class="big" style="min-height:110px;font-size:26px" data-act="allowLoc">Allow location</button><button class="btn wide" data-act="skipLoc">Not now</button></div>';
  }
}

/* ---------- flow A: the first screen ---------- */
function vHome(app){
  const t=openTrip();
  if(t)return vFishing(app,t);
  const p=S.plan&&mark(S.plan.markId)?S.plan:null;
  app.innerHTML='<h1>Planning a trip, or fishing now?</h1><p id="hl" class="mut sm">&nbsp;</p>'+
    (p?'<div class="card" style="margin:10px 0"><b>Planned: '+esc(mark(p.markId).name)+'</b><div class="mut sm">'+dlong(p.day)+'</div><button class="btn sm wide" style="margin-top:8px" data-act="startPlanned">Start this trip</button></div>':'')+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><button class="big" style="font-size:30px;min-height:max(240px,40vh)" data-go="plan">Plan a trip</button><button class="big" style="font-size:30px;min-height:max(240px,40vh);background:var(--tide);color:var(--bg)" data-act="startNow">Fish now</button></div>'+'<p class="mut" style="margin-top:20px">Built by fishermen who wanted to improve their catch rates by analysing the data. We made it simple and easy for everyone else to improve their fishing. Free, no account, and your trips stay on this phone.</p>'+recentHtml()+'<p class="mut sm" style="margin-top:24px;text-align:center">Version '+VERSION+'</p>';
  if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:'geolocation'}).then(q=>{if(q.state==='granted'&&!window._gp){window._gp=1;getPos().then(()=>{if(view==='home'&&!openTrip())render()})}}).catch(()=>{});
  const r=refPoint();
  if(r)getDay(r,ymd(new Date())).then(d=>{const e=document.getElementById('hl');if(!e)return;const f=d&&featsAt(d,hourOf(new Date()));e.innerHTML=f?esc(condText(f).replace(/^/,'Right now: ')):'Tide and wind need a signal.'});
  else{const e=document.getElementById('hl');e.innerHTML='&nbsp;'}
}
function vAbout(app){app.innerHTML='<p><button class="btn sm" data-go="home">‹ Back</button></p><h1>What is this?</h1><div class="card" style="font-size:18px;margin-top:10px">'+ABOUT+'</div><p class="mut sm" style="margin-top:12px">Free, no account. Your trips stay on this phone.</p>'}

/* ---------- flow C: fishing now ---------- */

    '<div class="chips" style="margin:14px 0">'+METHODS.map(x=>'<button class="chip" data-act="setMethod" data-s="'+x+'" aria-pressed="'+(S.method.m===x)+'">'+x+'</button>').join('')+'</div>'+

  app.innerHTML='<h1>'+esc(m?m.name:'Trip')+'</h1><p class="mut sm">Started '+hhmm(new Date(t.start))+' · '+Math.floor(mins/60)+'h '+(mins%60)+'m · '+condLine(t)+(t.method?' · '+esc(t.method)+(t.bait?', '+esc(t.bait):''):'')+'</p>'+
    '<button class="big" data-act="fishOn">Fish on<small>'+t.fish.length+' this trip</small></button>'+
    '<div class="dots" aria-label="Fish this trip">'+t.fish.map(f=>'<span class="pill">'+hhmm(new Date(f.t))+(f.sp?' · '+esc(f.sp):'')+(f.size?' · '+esc(f.size):'')+'</span>').join('')+'</div>'+
    '<div id="chart" class="card" style="margin-top:8px"><span class="mut">Loading…</span></div>'+
    '<button class="btn wide" style="margin-top:12px" data-act="endAsk">End trip</button>'+
    '<p style="margin-top:12px"><button class="chip" data-act="changeMethod">Change bait or method</button> '+(t.fish.length?'':'<button class="chip" data-act="cancelTrip">Cancel trip</button>')+'</p>';
  if(m)tideWeather('chart',m,ymd(new Date()),Math.max(0,Math.min(21,hourOf(new Date())-1)),false);
  if(!t.cond)fillCond(t).then(()=>{if(view==='home')render()});
}
function vStartPick(app){
  app.innerHTML='<p><button class="btn sm" data-go="home">‹ Back</button></p><h1>Where are you fishing?</h1><p class="mut">Location is not available, so pick a mark or search for the nearest town.</p>'+
    (S.marks.length?'<h2>Your marks</h2><div class="stack">'+S.marks.map(m=>'<button class="row" data-act="startAt" data-m="'+m.id+'"><b>'+esc(m.name)+'</b><span class="mut">›</span></button>').join('')+'</div>':'')+

    '<div class="stack" style="margin-top:16px"><button class="big" style="min-height:90px;font-size:24px" data-act="nameSpot">Save name</button><button class="btn wide" data-act="skipName">Skip</button></div>';

function vSummary(app){
  const t=S.trips.find(x=>x.id===viewArg);if(!t){go('home');return}
  const m=mark(t.markId);const mins=Math.max(1,Math.round(((t.end||Date.now())-t.start)/60000));
  const sp=[...new Set(t.fish.map(f=>f.sp).filter(Boolean))].join(', ');
  const here=S.trips.filter(x=>x.markId===t.markId&&(x.end||x.past)).length;
  app.innerHTML='<h1>'+(t.result==='fish'?(t.fish.length>1?t.fish.length+' fish':'1 fish'):'Blank trip, logged')+'</h1>'+
    '<div class="card stack" style="margin-top:10px"><div><b>'+esc(m?m.name:'')+'</b>'+(t.kind==='drift'?' <span class="pill">drift</span>':t.kind==='spot'?' <span class="pill">spot</span>':'')+'</div>'+
    '<div class="mut sm">'+Math.floor(mins/60)+'h '+(mins%60)+'m · '+condLine(t)+'</div>'+(sp?'<div class="sm">'+esc(sp)+'</div>':'')+

function recentHtml(){
  const r=S.trips.filter(t=>t.end||t.past).sort((a,b)=>b.start-a.start).slice(0,5);if(!r.length)return '<p class="mut sm" style="margin-top:22px">No trips yet. A blank trip counts as much as a fish, so log both.</p>';
  return '<h2>Recent trips</h2><div class="stack">'+r.map(tripRow).join('')+'</div>';
}
function tripRow(t){const m=mark(t.markId);
  return '<div class="row"><div><b><span class="dot'+(t.result==='fish'?' f':'')+'"></span> '+esc(m?m.name:'?')+'</b><div class="mut sm">'+dlong(ymd(new Date(t.start)))+' · '+condLine(t)+'</div></div><div style="display:grid;gap:6px;justify-items:end"><span class="pill">'+(t.result==='fish'?(t.fish.length||1)+' fish':'Blank')+'</span><button class="chip" data-act="share" data-t="'+t.id+'">Share</button></div></div>'}
/* share card: drawn on a canvas, no GPS, mark by its nickname only */
actions.share=async el=>{
  const t=S.trips.find(x=>x.id===el.dataset.t);if(!t)return;const m=mark(t.markId);
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#0b1a22';g.fillRect(0,0,W,H);g.fillStyle='#ff6a2b';g.fillRect(0,0,W,18);
  g.fillStyle='#9fb6c0';g.font='700 40px system-ui,sans-serif';g.fillText(dlong(ymd(new Date(t.start))).toUpperCase(),72,150);
  g.fillStyle='#eaf3f6';g.font='900 150px system-ui,sans-serif';
  const fish=t.result==='fish',sp=[...new Set(t.fish.map(f=>f.sp).filter(Boolean))].join(' and ');
  const head=fish?(t.fish.length>1?t.fish.length+' fish':'Fish on'):'Blanked';
  g.fillText(head,72,360);
  g.font='700 64px system-ui,sans-serif';g.fillStyle='#ff6a2b';if(sp)g.fillText(sp,72,450);
  g.fillStyle='#eaf3f6';g.font='700 56px system-ui,sans-serif';g.fillText(m?m.name:'',72,sp?560:470);
  g.fillStyle='#9fb6c0';g.font='500 46px system-ui,sans-serif';g.fillText(condText(t.cond),72,sp?640:550);
  g.fillStyle='#9fb6c0';g.font='500 40px system-ui,sans-serif';
  g.fillText(fish?'':'No fish today. It still counts.',72,740);
  g.fillStyle='#eaf3f6';g.font='800 48px system-ui,sans-serif';g.fillText('Fishful Thinking',72,H-110);
  g.fillStyle='#9fb6c0';g.font='500 36px system-ui,sans-serif';g.fillText('Free sea fishing log for crews',72,H-56);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'fishful-catch.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:'Logged on Fishful Thinking'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const box=document.createElement('div');box.className='card';box.style.marginTop='12px';
  box.innerHTML='<p class="sm mut">Press and hold the picture to save or share it.</p><img alt="Share card" style="width:100%;border-radius:12px" src="'+u+'">';(el.closest('.row')||el).after(box);
};

function newMark(n,lat,lng){const m={id:uid(),name:n,lat,lng};S.marks.push(m);S.last=m.id;save();return m}
/* place picker: type a town, harbour or beach, or use the phone's location. No coordinates are ever typed. */
let placeResults=[],pTimer=null;
function pickerHtml(){
  return '<label for="ps">Search a town, harbour or beach</label><input id="ps" type="search" placeholder="e.g. Salcombe" autocomplete="off" enterkeyhint="search">'+
    '<div id="pres" class="stack" style="margin-top:10px"></div><p id="pmsg" class="note" style="display:none;margin-top:10px"></p>'+
    '<p class="mut sm" style="margin:16px 0 8px;text-align:center">or</p><button class="btn wide" data-act="useHere">Use where I am now</button>'+
    '';
}
function pmsg(t){const e=document.getElementById('pmsg');if(!e)return;e.textContent=t||'';e.style.display=t?'block':'none'}
function bindPicker(){
  const i=document.getElementById('ps');if(!i)return;
  i.addEventListener('input',()=>{clearTimeout(pTimer);const q=i.value.trim();if(q.length<3){document.getElementById('pres').innerHTML='';pmsg('');return}pTimer=setTimeout(()=>searchPlaces(q),350)});
}
async function searchPlaces(q){
  const box=document.getElementById('pres');if(!box)return;
  try{
    const r=await jfetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language=en&format=json&countryCode=GB');
    placeResults=(r&&r.results)||[];
    if(!document.getElementById('pres'))return;
    pmsg(placeResults.length?'':'No match. Try the nearest town, or use where you are now.');
    box.innerHTML=placeResults.map((p,k)=>'<button class="row" data-act="pickPlace" data-i="'+k+'"><div><b>'+esc(p.name)+'</b><div class="mut sm">'+esc([p.admin2,p.admin1].filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j).join(', '))+'</div></div><span class="mut">›</span></button>').join('');
  }catch(e){pmsg('Searching needs a signal. Try again, or use where you are now.')}
}
function afterMark(m){if(pickCtx==='start'){beginTrip(m,S.here);return}if(pickCtx==='plan'){planWhere=m.id;planMark=m.id;planStep=2}go(pickCtx==='plan'?'plan':(view==='addmark'?'marks':'home'))}
actions.pickPlace=el=>{const p=placeResults[+el.dataset.i];if(!p)return;const nick='';afterMark(newMark(nick||p.name,+p.latitude.toFixed(4),+p.longitude.toFixed(4)))};
actions.useHere=el=>{
  if(!navigator.geolocation){pmsg('Location is not available on this phone. Search for the nearest town instead.');return}
  el.textContent='Finding you…';
  navigator.geolocation.getCurrentPosition(p=>{const nick='';afterMark(newMark(nick||('Mark '+(S.marks.length+1)),+p.coords.latitude.toFixed(4),+p.coords.longitude.toFixed(4)))},
    ()=>{el.textContent='Use where I am now';pmsg('Location is switched off for this app. Search for the nearest town or harbour instead.')},{timeout:12000,maximumAge:60000});
};

actions.delMark=el=>{const m=mark(el.dataset.m);if(!m)return;S.marks=S.marks.filter(x=>x!==m);S.trips=S.trips.filter(t=>t.markId!==m.id);if(S.last===m.id)S.last=null;if(S.plan&&S.plan.markId===m.id)S.plan=null;save();go('marks')};
actions.planIt=el=>{S.plan={markId:el.dataset.m,day:planDay,start:planStart};save();go('home')};
actions.renameMark=el=>{const m=mark(el.dataset.m),v=document.getElementById('rn').value.trim();if(m&&v){m.name=v;save();go('mark',m.id)}};

    '<p style="margin-top:16px"><button class="chip" data-act="delMark" data-m="'+m.id+'">Delete this mark'+(ts.length?' and its '+ts.length+' trip'+(ts.length===1?'':'s'):'')+'</button></p>'+'<h2>Trips</h2><div class="stack">'+ts.slice().reverse().map(t=>tripRow(t)+'<div style="text-align:right;margin-top:-6px"><button class="chip" data-act="delTrip" data-t="'+t.id+'">Delete trip</button></div>').join('')+'</div>';
}

/* ---------- plan ---------- */
function planDays(){const t=ymd(new Date());const dow=new Date(t+'T12:00:00Z').getUTCDay();const out=[['Today',t],['Tomorrow',addDays(t,1)]];
  const sat=addDays(t,(6-dow+7)%7||7), sun=addDays(sat,1);
  if(dow===6){out.push(['Sunday',addDays(t,1)])}else if(dow===0){out.push(['Next Sat',sat])}else{out.push(['Sat',sat],['Sun',sun])}
  const seen=new Set();return out.filter(([,d])=>!seen.has(d)&&seen.add(d)).slice(0,4)}
let planWhere=null, planStep=1;
function planHead(){const w=planWhere,m=w&&w!=='any'?mark(w):null;return '<p><button class="btn sm" data-act="planBack">‹ Back</button></p>'}
function vPlan(app){
  pickCtx='plan';
  if(planWhere&&planWhere!=='any'&&!mark(planWhere)){planWhere=null;planStep=1}
  if(planStep>1&&!planWhere)planStep=1;
  const w=planWhere,days=planDays();
  if(planStep===1){
    app.innerHTML='<h1>Where are you going?</h1>'+
      (S.marks.length?'<div class="chips" style="margin:12px 0">'+S.marks.map(m=>'<button class="chip" data-act="where" data-m="'+m.id+'">'+esc(m.name)+'</button>').join('')+'</div>':'')+
      pickerHtml();
    bindPicker();return;
  }
  const mk=mark(w);
  app.innerHTML=planHead()+'<h1>'+esc(mk.name)+'</h1><h2 style="margin-top:6px">When?</h2><div class="chips" style="flex-wrap:nowrap;gap:6px;align-items:center">'+days.map(([l,d])=>'<button class="chip" style="padding:0 12px;font-size:15px;flex:none" data-act="day" data-d="'+d+'" aria-pressed="'+(planDay===d)+'">'+l+'</button>').join('')+
    '<input id="pday" type="date" value="'+planDay+'" aria-label="Pick a day" style="flex:1;min-width:0;width:auto;min-height:48px;padding:4px 6px;font-size:14px">'+'</div>'+
    '<div id="chart" class="card" style="margin-top:12px"><span class="mut">Loading…</span></div>'+
    '<h2>What\'s catching?</h2><div id="catching" class="card"><span class="mut">Looking…</span></div>'+
    '<button class="big" style="min-height:84px;font-size:24px;margin-top:16px" data-act="planIt" data-m="'+mk.id+'">Plan it<small>'+dlong(planDay)+'</small></button>';
  document.getElementById('pday').addEventListener('change',e=>{if(e.target.value){planDay=e.target.value;render()}});
  tideWeather('chart',mk,planDay,planStart,false,true);whatsCatching();
}
actions.planBack=()=>{planStep=Math.max(1,planStep-1);render()};

const km=(a,b)=>dist(a,b)/1000;
async function whatsCatching(){
  const box=document.getElementById('catching');if(!box)return;
  const m=planWhere&&planWhere!=='any'?mark(planWhere):null;const pt=m||refPoint();
  if(!pt){box.innerHTML='<span class="mut">Choose a place to see what is being caught.</span>';return}
  const since=Date.now()-30*864e5;
  const near=S.trips.filter(t=>(t.end||t.past)&&t.start>=since&&mark(t.markId)&&km(pt,mark(t.markId))<=40);
  const fish=near.reduce((n,t)=>n+t.fish.length,0),sp={};near.forEach(t=>t.fish.forEach(f=>{if(f.sp)sp[f.sp]=(sp[f.sp]||0)+1}));
  let h='<b>Your crew, last 30 days</b><div class="sm" style="margin:4px 0 12px">'+(near.length?near.length+' trip'+(near.length===1?'':'s')+', '+fish+' fish'+(Object.keys(sp).length?': '+Object.entries(sp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' '+v).join(', '):''):'<span class="mut">No trips near here yet.</span>')+'</div>';
  let D=null;try{D=await jfetch('catching.json?'+Math.floor(Date.now()/36e5))}catch(e){}
  if(D){const r=(D.regions||[]).find(r=>pt.lat>=r.box[0]&&pt.lat<=r.box[1]&&pt.lng>=r.box[2]&&pt.lng<=r.box[3]);
    h+=(r&&r.summary)?'<b>Recent public reports, '+esc(r.name)+'</b><div class="sm" style="margin:4px 0">'+esc(r.summary)+'</div><div class="mut sm">Reports from '+esc(r.reportDate||r.checked)+'</div>':'<b>Recent public reports</b><div class="sm mut" style="margin:4px 0">Nothing recent found for this area yet.</div>'}
  const b2=document.getElementById('catching');if(b2)b2.innerHTML=h;
}
actions.where=el=>{planWhere=el.dataset.m;planMark=planWhere==='any'?null:planWhere;planStep=2;window.scrollTo(0,0);render()};
function planDraw(){const m=planWhere&&planWhere!=='any'?mark(planWhere):null;const r=m||refPoint();const box=document.getElementById('chart');if(!r){if(box)box.innerHTML='<span class="mut">Choose a place to see the tide and wind.</span>';return}
  tideWeather('chart',r,planDay,planStart,true);
  getDay(r,planDay).then(d=>{const e=document.getElementById('windline');if(!e||!d)return;const f=featsAt(d,planStart+1);if(false)e.innerHTML='<b>Wind '+oct(f.wdr)+' '+f.wsp+' kn</b>'+(f.tide?' · '+cap(f.tide)+' tide':'')+'<div class="mut sm">At '+(m?esc(m.name):(r===S.here?'your location':esc(r.name)))+'</div>'})}
actions.day=el=>{planDay=el.dataset.d;render()};

  const m=mark(planMark)||refPoint();if(!m)return;const nm=m.name||'the coast',day=await getDay(m,planDay),f=day?featsAt(day,planStart+1):null;
  const txt='Thinking of fishing '+nm+' on '+dlong(planDay)+', '+String(planStart).padStart(2,'0')+':00 to '+String((planStart+3)%24).padStart(2,'0')+':00'+(f&&(f.tide||f.wsp!=null)?' ('+[f.tide?f.tide+' tide':null,f.wsp!=null?oct(f.wdr)+' '+f.wsp+' kn':null].filter(Boolean).join(', ')+')':'')+'. Anyone fished it lately? What is catching?';

/* ---------- tide, springs and neaps, weather ---------- */
function extremes(lvl){
  const out=[];if(!lvl)return out;
  for(let h=1;h<23;h++){const a=lvl[h-1],b=lvl[h],c=lvl[h+1];if(a==null||b==null||c==null)continue;
    const hi=b>=a&&b>c,lo=b<=a&&b<c;if(!hi&&!lo)continue;
    const d=a-2*b+c;const off=d?0.5*(a-c)/d:0;const t=h+Math.max(-.5,Math.min(.5,off));
    out.push({hi,t,mins:Math.round(t*60)})}
  return out;
}
function moonAge(date){const jd=Date.UTC(+date.slice(0,4),+date.slice(5,7)-1,+date.slice(8,10),12)/864e5+2440587.5;return(((jd-2451550.1)%29.530588)+29.530588)%29.530588}
function springNeap(date){
  const f=a=>Math.abs(Math.cos(2*Math.PI*a/29.5306)),a=moonAge(date),v=f(a-1.5),vn=f(a-0.5);
  const lab=v>=.8?'Springs':v<=.35?'Neaps':(vn>v?'Building to springs':'Easing to neaps');return{v,lab}
}
const WC=c=>c==null?'':c===0?'Clear':c<=2?'Mostly clear':c===3?'Overcast':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':c<=86?'Snow showers':'Thunderstorms';
const clock=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function mapHtml(m,date){const d=Math.max(0,Math.round((new Date(date+'T12:00:00Z')-new Date(ymd(new Date())+'T12:00:00Z'))/864e5));const cal=d===0?'now':d===1?'24':d===2?'48':'72';
  return '<iframe title="Wind map" loading="lazy" style="width:100%;height:300px;border:0;border-radius:12px;margin-top:14px" src="https://embed.windy.com/embed2.html?lat='+m.lat+'&lon='+m.lng+'&detailLat='+m.lat+'&detailLon='+m.lng+'&zoom=9&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar='+cal+'&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1"></iframe>'}
function periodRows(day){
  const P=[['Morning',6,11],['Afternoon',12,17],['Evening',18,22]];
  const av=(a,x,y)=>{const v=[];for(let h=x;h<=y;h++)if(a&&a[h]!=null)v.push(a[h]);return v.length?v.reduce((p,q)=>p+q,0)/v.length:null};
  return '<div style="margin-top:14px">'+P.map(([n,x,y])=>{const w=av(day.wsp,x,y),d=av(day.wdr,(x+y)>>1,(x+y)>>1),t=av(day.tmp,x,y),r=day.rain?av(day.rain,x,y)*(y-x+1):null,c=day.wc?day.wc[(x+y)>>1]:null;
    return '<div style="display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)"><b>'+n+'</b><div class="sm">'+(w!=null?'<b>'+oct(d)+' '+Math.round(w)+' kn</b>':'')+(c!=null?' · '+WC(c):'')+(t!=null?' · '+Math.round(t)+'°C':'')+(r!=null&&r>=0.1?' · rain '+r.toFixed(1)+' mm':'')+'</div></div>'}).join('')+'</div>';
}
async function tideWeather(id,m,date,start,withMap,periods){
  const box=document.getElementById(id);if(!box||!m)return;const day=await getDay(m,date);const b2=document.getElementById(id);if(!b2)return;
  if(!day||!day.lvl||day.lvl.every(x=>x==null)){b2.innerHTML='<span class="mut">No tide or weather forecast yet. Connect to the internet once and it is saved on the phone.</span>';return}
  const ex=extremes(day.lvl),v=day.lvl.filter(x=>x!=null),rg=Math.max(...v)-Math.min(...v),sn=springNeap(date);
  const hs=Array.from({length:4},(_,i)=>start+i).filter(h=>h<24);
  const avg=a=>{const x=hs.map(h=>a&&a[h]).filter(z=>z!=null);return x.length?x.reduce((p,q)=>p+q,0)/x.length:null};
  const wsp=avg(day.wsp),gst=Math.max(...hs.map(h=>day.gst&&day.gst[h]||0)),wdr=day.wdr[start+1],tmp=avg(day.tmp),rain=hs.reduce((n,h)=>n+(day.rain&&day.rain[h]||0),0),cld=avg(day.cld),prs=avg(day.prs),wc=day.wc?day.wc[start+1]:null;
  let h='<div class="chips" style="gap:8px">'+ex.map(e=>'<div class="pill" style="font-size:15px;padding:6px 12px;color:var(--ink);border-color:'+(e.hi?'var(--tide)':'var(--line)')+'"><b>'+(e.hi?'High ':'Low ')+clock(e.mins)+'</b></div>').join('')+'</div>'+
    '<div class="sm" style="margin-top:12px"><b>'+sn.lab+'</b> · range about '+rg.toFixed(1)+' m</div>'+
    '<div style="display:flex;align-items:flex-end;gap:5px;height:34px;margin:10px 0 2px" aria-hidden="true">'+[0,1,2,3,4,5,6].map(k=>'<div style="flex:1;height:'+(8+k*4)+'px;border-radius:3px;background:'+(k===Math.round(sn.v*6)?'var(--acc)':'var(--line)')+'"></div>').join('')+'</div>'+
    '<div class="legend" style="justify-content:space-between;margin-top:2px"><span>Neaps</span><span>Springs</span></div>'+
    (periods?mapHtml(m,date):
    '<div class="sm" style="margin-top:14px"><b>'+String(start).padStart(2,'0')+':00 to '+String((start+3)%24).padStart(2,'0')+':00</b></div>'+
    '<div class="sm">'+(wc!=null?WC(wc)+(tmp!=null?', ':''):'')+(tmp!=null?Math.round(tmp)+'°C':'')+'</div>'+
    (wsp!=null?'<div class="sm">Wind '+oct(wdr)+' '+Math.round(wsp)+' kn'+(gst>0?', gusts '+Math.round(gst):'')+'</div>':'')+
    ((rain!=null&&day.rain)?'<div class="sm">Rain '+(rain<0.1?'none':rain.toFixed(1)+' mm')+(cld!=null?' · cloud '+Math.round(cld)+'%':'')+'</div>':''))+
    '<div class="mut sm" style="margin-top:10px">Tide times and range are from a weather model, so treat them as about right, within half an hour.</div>';
  b2.innerHTML=h;
}
async function drawChart(id,m,date,start){
  const box=document.getElementById(id);if(!box||!m)return;const day=await getDay(m,date);if(!document.getElementById(id))return;const planDay=date,planStart=start;
  if(!day||!day.lvl||day.lvl.every(x=>x==null)){box.innerHTML='<span class="mut">No tide or wind forecast yet. Connect to the internet once and it will be saved on the phone for offline use.</span>';return}
  const W=340,H=130,v=day.lvl.filter(x=>x!=null),mn=Math.min(...v),mx=Math.max(...v),X=h=>10+h/23*(W-20),Y=l=>H-26-((l-mn)/((mx-mn)||1))*(H-50);
  let p='';day.lvl.forEach((l,h)=>{if(l!=null)p+=(p?'L':'M')+X(h).toFixed(1)+' '+Y(l).toFixed(1)});
  const now=ymd(new Date())===planDay?hourOf(new Date()):null;
  let arrows='';for(let h=0;h<24;h+=3){if(day.wsp[h]==null)continue;arrows+='<g transform="translate('+X(h).toFixed(1)+' '+(H-8)+')"><path d="M0 -6 L4 4 L0 1 L-4 4Z" transform="rotate('+(day.wdr[h]+180)+')" fill="var(--tide)"/><text x="9" y="3" font-size="10">'+Math.round(day.wsp[h])+'</text></g>'}
  let ticks='';[0,6,12,18,23].forEach(h=>{ticks+='<text x="'+X(h)+'" y="12" text-anchor="middle">'+String(h).padStart(2,'0')+'</text>'});
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Tide height through the day with wind arrows"><rect x="'+X(planStart)+'" y="16" width="'+(X(Math.min(23,planStart+3))-X(planStart))+'" height="'+(H-50)+'" fill="var(--acc)" opacity=".18"/>'+
    '<path d="'+p+'" fill="none" stroke="var(--tide)" stroke-width="3" stroke-linejoin="round"/>'+(now!=null?'<line x1="'+X(now)+'" x2="'+X(now)+'" y1="16" y2="'+(H-30)+'" stroke="var(--ink)" stroke-dasharray="3 3"/>':'')+ticks+arrows+'</svg>'+
    '<div class="legend"><span>Blue line: tide height (approximate model)</span><span>Arrows: wind, knots</span></div>';
}
async function computePlan(){
  const list=document.getElementById('planlist');const m=planWhere&&mark(planWhere);if(!list||!m)return;
  const day=await getDay(m,planDay);
  const all=S.trips.filter(t=>t.markId===m.id&&(t.end||t.past)),ts=all.filter(t=>t.cond);
  const res=[['morning',8],['afternoon',14],['evening',19]].map(([name,mid])=>{
    const f=day?featsAt(day,mid):null;let num=0,den=0,n=0;
    if(f)for(const t of ts){let w=0,mx=0;const c=t.cond;
      if(f.tide&&c.tide){mx+=2;if(f.tide===c.tide)w+=2}
      if(f.wdr!=null&&c.wdr!=null){mx+=1;const d=Math.abs(f.wdr-c.wdr)%360;if(Math.min(d,360-d)<=45)w+=1}
      if(f.wsp!=null&&c.wsp!=null){mx+=1;if(Math.abs(f.wsp-c.wsp)<=5)w+=1}
      if(c.h!=null){mx+=1;if(Math.abs(mid-c.h)<=3)w+=1}
      if(mx>=3&&w>=Math.ceil(mx*0.6)){n++;den+=w;if(t.result==='fish')num+=w}}
    return{name,n,rate:den?num/den:null,f}}).filter(r=>r.n>=2).sort((a,b)=>b.rate-a.rate);
  const best=res[0];
  const verdict=(all.length>=5&&best)?(best.rate>=0.6?'Promising':best.rate>=0.35?'Worth a go':'Slow')+' in the '+best.name+': caught on '+Math.round(best.rate*best.n)+' of '+best.n+' similar trips':'Not enough trips here yet'+(all.length?' ('+all.length+' logged)':'');
  const f14=day?featsAt(day,14):null;const bad=f14&&f14.wdr!=null&&m.wind&&!m.wind.includes(oct(f14.wdr));
  if(!document.getElementById('planlist'))return;
  list.innerHTML='<div class="card"><b>Your record here</b><div class="sm">'+esc(verdict)+'</div></div>'+(bad?'<p class="note" style="margin-top:10px">The wind is from a direction you marked as poor here.</p>':'');
  const pi=document.getElementById('planit');if(pi)pi.innerHTML='<button class="big" style="min-height:84px;font-size:24px;margin-top:12px" data-act="planIt" data-m="'+m.id+'">Plan it<small>'+dlong(planDay)+'</small></button>';
  fillMissing();
}
let filling=false;
async function fillMissing(){if(filling)return;filling=true;let any=false;for(const t of S.trips){if((t.end||t.past)&&!t.cond){await fillCond(t);if(t.cond)any=true}}filling=false;if(any&&view==='plan')computePlan()}

/* ---------- me: export / import ---------- */
function toCsv(){const rows=[['date','time','mark','result','fish','species','tide','wind_dir','wind_kn']];
  S.trips.filter(t=>t.end||t.past).sort((a,b)=>a.start-b.start).forEach(t=>{const d=new Date(t.start),m=mark(t.markId);const c=t.cond||{};
    rows.push([ymd(d),hhmm(d),m?m.name:'',t.result,t.fish.length,t.fish.map(f=>f.sp||'').filter(Boolean).join('/'),c.tide||'',c.wdr==null?'':oct(c.wdr),c.wsp==null?'':c.wsp])});
  return rows.map(r=>r.map(x=>{x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\n')}
function parseCsv(txt){const rows=[];let r=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows}
function importCsv(txt){
  if(!S.marks.length)return 'Add your first mark on the Home tab first, so tide and wind are looked up in the right place.';
  const rows=parseCsv(txt);if(!rows.length)return 'Nothing to import.';
  const hdr=rows[0].map(x=>x.trim().toLowerCase());const hasH=hdr.includes('date');const body=hasH?rows.slice(1):rows;
  const ix=n=>hasH?hdr.indexOf(n):['date','time','mark','result','species'].indexOf(n);let added=0,skipped=0;
  for(const r of body){const d=(r[ix('date')]||'').trim();let date=d;
    const m1=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m1){const y=m1[3].length===2?'20'+m1[3]:m1[3];date=y+'-'+m1[2].padStart(2,'0')+'-'+m1[1].padStart(2,'0')}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){skipped++;continue}
    const tm=((r[ix('time')]||'07:00').trim().match(/^\d{1,2}:\d{2}/)||['07:00'])[0].padStart(5,'0');
    const name=(r[ix('mark')]||'').trim()||S.marks[0].name;let m=S.marks.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!m){m={id:uid(),name,lat:S.marks[0].lat,lng:S.marks[0].lng,approx:true};S.marks.push(m)}
    const res=(r[ix('result')]||'fish').trim().toLowerCase();const blank=/^(blank|no|none|0|nothing|n)/.test(res);
    const start=new Date(date+'T'+tm+':00').getTime();if(!isFinite(start)){skipped++;continue}
    if(S.trips.some(t=>t.start===start&&t.markId===m.id)){skipped++;continue}
    const sp=(r[ix('species')]||'').trim();
    S.trips.push({id:uid(),markId:m.id,start,end:start+3*3600e3,past:true,result:blank?'blank':'fish',fish:blank?[]:[{id:uid(),t:start,sp:sp||null,size:null}]});added++}
  save();fillMissing();return 'Imported '+added+' trip'+(added===1?'':'s')+(skipped?'; skipped '+skipped:'')+'. Tide and wind are filled in the background.';
}
function vMe(app){
  const n=S.trips.filter(t=>t.end||t.past).length,b=S.trips.filter(t=>(t.end||t.past)&&t.result==='blank').length,miss=S.trips.filter(t=>(t.end||t.past)&&!t.cond).length;
  app.innerHTML='<h1>Me</h1><p class="mut">'+n+' trips logged, '+b+' of them blank. Everything is saved on this phone.'+(miss?' '+miss+' still need tide and wind.':'')+'</p>'+
    '<h2>Your data</h2><div class="stack"><button class="btn wide" data-act="exportCsv">Show my trips as CSV</button><button class="btn wide" data-act="exportJson">Show a full backup</button></div><textarea id="out" rows="6" style="margin-top:10px;display:none" readonly aria-label="Exported data"></textarea>'+
    '<h2>More</h2><div class="stack"><button class="btn wide" data-go="past">Add a past trip</button><button class="btn wide" data-go="about">What is this?</button></div>'+
    '<h2>Import past catches</h2><p class="mut sm">Paste rows with: date, time, mark, result (fish or blank), species. A header row is fine. Dates like 2026-08-14 or 14/08/2026.</p><textarea id="inp" rows="5" placeholder="date,time,mark,result,species&#10;2026-08-14,06:30,My first mark,fish,Bass"></textarea>'+
    '<p><button class="btn pri wide" data-act="doImport">Import</button></p><p id="imsg" class="mut sm"></p>'+
    '<h2>About</h2><p class="mut sm">Tide height here is an approximate weather-model value, good enough to see rising or falling water. Official tide tables can replace it later.</p>';
}
actions.exportCsv=()=>{const o=document.getElementById('out');o.style.display='block';o.value=toCsv();o.select()};
actions.exportJson=()=>{const o=document.getElementById('out');o.style.display='block';o.value=JSON.stringify(S);o.select()};
actions.doImport=()=>{const v=document.getElementById('inp').value;document.getElementById('imsg').textContent=importCsv(v)};

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
fillMissing();
/* self-heal: if the live copy is newer than this one, drop saved copies and reload once */
fetch('index.html?chk='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VERSION='([^']+)'/);if(m&&m[1]!==VERSION&&!sessionStorage.getItem('healed')){sessionStorage.setItem('healed','1');(navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([])).then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches.keys()).then(k=>Promise.all(k.map(x=>caches.delete(x)))).then(()=>location.reload())}}).catch(()=>{});
</script>
